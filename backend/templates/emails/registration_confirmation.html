<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0; padding:0; background-color:#ede4f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <span style="display:none; font-size:1px; color:#ede4f7; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
      {{ preheader }}
    </span>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ede4f7; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px; width:100%; background-color:#ffffff; border-radius:20px; overflow:hidden; box-shadow:0 10px 40px -10px rgba(88,28,135,0.25);">

            <!-- Header -->
            <tr>
              <td style="background:linear-gradient(135deg,#0f172a 0%,#312e81 60%,#7e22ce 100%); padding:36px 40px; text-align:center;">
                <img src="{{ frontend_url }}/images/logo.png" alt="FitZone" height="40" style="height:40px; width:auto; display:inline-block;" />
              </td>
            </tr>

            <!-- Hero -->
            <tr>
              <td style="padding:40px 40px 8px;">
                <p style="margin:0 0 8px; font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#9333ea;">
                  FitZone
                </p>
                <h1 style="margin:0; font-size:28px; line-height:1.25; font-weight:800; color:#18151f;">
                  {{ greeting }}
                </h1>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:16px 40px 8px;">
                <p style="margin:0 0 24px; font-size:16px; line-height:1.6; color:#3f3a4d;">
                  {{ intro }}
                </p>

                <p style="margin:0 0 12px; font-size:14px; font-weight:700; color:#18151f;">
                  {{ list_title }}
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 28px; width:100%;">
                  {% for item in list_items %}
                  <tr>
                    <td style="padding:6px 0; font-size:15px; line-height:1.5; color:#3f3a4d; vertical-align:top; width:24px;">
                      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#a855f7; margin-top:7px;"></span>
                    </td>
                    <td style="padding:6px 0; font-size:15px; line-height:1.5; color:#3f3a4d;">
                      {{ item }}
                    </td>
                  </tr>
                  {% endfor %}
                </table>

                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 32px;">
                  <tr>
                    <td style="border-radius:10px; background:linear-gradient(135deg,#c084fc,#9333ea);">
                      <a href="{{ frontend_url }}{{ cta_path }}" style="display:inline-block; padding:14px 28px; font-size:15px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px;">
                        {{ cta_label }} &rarr;
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="padding:24px 40px 32px; border-top:1px solid #ede4f7;">
                <p style="margin:0 0 6px; font-size:12px; line-height:1.6; color:#8f8aa0;">
                  {{ footer_note }}
                </p>
                <p style="margin:0; font-size:12px; line-height:1.6; color:#8f8aa0;">
                  FitZone — 42 rue de la Forme, 1000 Bruxelles
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
